<!DOCTYPE html>
<html data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title|default:"DJCRM" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="/static/css/base.css" >
	<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico">
</head>
  <body>
	{% include 'core/includes/navbar.html' %}
	<h1 class="text-center mt-3 h3">{{ header }}</h1>

	{% if messages %}
		{% include 'core/includes/messages.html' %}
	{% endif %}

	{% block content %}
	{% endblock %}

	{% if page_obj.has_other_pages %}
		{% include 'core/includes/navigation.html' %}
	{% endif %}

	{% include 'core/includes/footer.html' %}
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
