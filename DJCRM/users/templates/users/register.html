{% extends 'core/base.html' %}

{% block content %}
<h1 class="text-center mt-3">Registration</h1>

<form method="post" class="w-50 mx-auto mb-5 ml-5 mr-5 d-flex gap-3 flex-column">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}" />
        <div class="form-error">{{ form.non_field_errors }}</div>
   		{% for f in form %}
		<div class="form-group">
			<label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
			<div class="form-error">{{ f.errors }}</div>
        </div>
		{% endfor %}
    <p><button type="submit" class="btn btn-primary">Register</button></p>
</form>


{% endblock %}
