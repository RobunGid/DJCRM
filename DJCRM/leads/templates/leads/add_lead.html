{% extends 'core/base.html' %}

{% block content %}
<form action="" method="post" enctype="multipart/form-data" class="w-50 mx-auto ml-5 mr-5 mb-5 d-flex gap-3 flex-column">
    {% csrf_token %}
	<input type="hidden" name="text" value="{{ enxt }}"/>
        <div>{{ form.non_field_errors }}</div>
		{% for f in form %}
			<div class="form-group">
				<label for="{{ f.id_for_label }}" class="form-label">{{ f.label }}</label>
				{{ f }}
				<div>{{ f.errors }}</div>
			</div>
		{% endfor %}
    <p><button type="submit" class="btn btn-primary">Create</button></p>
</form>
{% endblock %}
